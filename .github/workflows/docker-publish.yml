name: Build and publish Docker image

on:
  push:
    branches: [main]
  # Weekly rebuild so the image picks up new freqtrade stable releases even
  # when this repo has no new commits.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/saamy4r/freqtrade-replay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Always pull the newest freqtradeorg/freqtrade:stable and never reuse
          # cached layers, so the image is built on the latest official release.
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
